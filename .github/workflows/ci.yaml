name: CI

on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+' # Match semantic versioning tags
    branches:
      - dev
      - main
    paths-ignore:
      - '*.md'

env:
  kibot_config: kibot_yaml/kibot_main.yaml
  # Used variant. We assume:
  # DRAFT: only schematic in progress, will only generate schematic PDF, netlist and BoM
  # PRELIMINARY: will generate both schematic and PCB documents, but no ERC/DRC
  # CHECKED: will generate both schematic and PCB documents, with ERC/DRC
  # RELEASED: similar to CHECKED, automatically selected when pushing a tag on main
  kibot_variant: DRAFT

  # Use 9 for KiCad 9 projects or 10 for KiCad 10 projects; no plugin is required.
  # Keep the existing KiCad 9 default. Set 10 when migrating a project.
  kicad_version: 9

  kibot_log: kibot_run.log
 
permissions:
  contents: write

jobs:
  release:
    needs: generate_outputs
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # Use the files generated by this run, without pulling a moving branch.
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: release_files
          path: .

      - name: Release
        uses: docker://antonyurchenko/git-release:v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: |
            Schematic/*.pdf
            Manufacturing/Assembly/*
            Manufacturing/Fabrication/*.pdf
            Manufacturing/Fabrication/*.zip
            Manufacturing/Fabrication/*.txt
            3D/*.step
            Testing/Testpoints/*.csv

  generate_outputs:
    # As upstream, skip the standard PR merge commit; dev was already checked.
    # A release tag always generates RELEASED outputs.
    if: >-
      ${{ !contains(github.event.head_commit.message, 'Merge pull request') || github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Generate from the exact tag. A release can update main only if it still
      # points at this source revision; never merge later designs into a release.
      - name: Check release source
        if: ${{ github.ref_type == 'tag' }}
        run: |
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::Tag the current main tip to release it. main has a different revision."
            exit 1
          fi

      - name: Update changelog
        if: ${{ github.ref_type == 'tag' }}
        uses: thomaseizinger/keep-a-changelog-new-release@v2
        with:
          tag: ${{ github.ref_name }}

      - name: Select project status and revision
        shell: bash
        run: |
          case "$kicad_version" in 9|10) ;; *) exit 1 ;; esac
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            echo "kibot_variant=RELEASED" >> "$GITHUB_ENV"
            echo "PORT_REVISION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            last_tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
            echo "PORT_REVISION=${last_tag}*" >> "$GITHUB_ENV"
          fi

      - name: Generate notes, outputs and README with pinned KiBot
        run: >-
          python3 kibot_resources/scripts/run_kibot.py --container
          --major "$kicad_version" --variant "$kibot_variant"
          --config "$kibot_config" --version "$PORT_REVISION" --network bridge

      # KiBot changes PCB geometry/tables while plotting. Restore the design
      # before either tag or branch output commits; retain project text variables.
      - name: Discard PCB changes and remove temporary files
        run: |
          git ls-files -z '*.kicad_pcb' | xargs -0 -r git restore --source=HEAD --
          git clean -f -- '*.kicad_pcb' '*.kicad_pro' '*.kicad_dru' '*.kicad_prl'

      # Transfer the generated assets and updated changelog directly to release.
      - name: Store release files
        if: ${{ github.ref_type == 'tag' }}
        uses: actions/upload-artifact@v4
        with:
          name: release_files
          if-no-files-found: error
          path: |
            CHANGELOG.md
            Schematic/*.pdf
            Manufacturing/Assembly/*
            Manufacturing/Fabrication/*.pdf
            Manufacturing/Fabrication/*.zip
            Manufacturing/Fabrication/*.txt
            3D/*.step
            Testing/Testpoints/*.csv

      - name: Save release outputs to main
        if: ${{ github.ref_type == 'tag' }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "GitHub Actions"
          git add -A -- . ':!kibot_run*.log'
          if ! git diff --cached --quiet; then
            git commit -m "Update Outputs (release)"
          fi
          # A normal push rejects concurrent changes instead of overwriting them.
          git push origin HEAD:main

      - name: Check branch has not advanced
        if: ${{ github.ref_type != 'tag' }}
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          if [[ "$(git rev-parse FETCH_HEAD)" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::Branch advanced during generation; rerun CI on its latest commit."
            exit 1
          fi

      - name: Update Outputs
        if: ${{ github.ref_type != 'tag' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: ${{ github.ref_name }}
          commit_message: Update Outputs

      - name: Store log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: log_file
          path: ${{ env.kibot_log }}

      - name: Store notes log
        if: ${{ always() && env.kibot_variant != 'DRAFT' }} 
        uses: actions/upload-artifact@v4
        with:
          name: log_file_notes
          path: kibot_run_notes.log

      - name: Store README log
        if: ${{ always() && env.kibot_variant == 'DRAFT' }} 
        uses: actions/upload-artifact@v4
        with:
          name: log_file_readme
          path: kibot_run_readme.log
