name: KiCad port trial (artifacts only)
on:
  workflow_dispatch:
  push:
    branches: ['dev_k10', 'port/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: kicad-port-trial-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workflow:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        major: [9, 10]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free hosted runner space for the full KiCad runtime
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Generate and inspect all four workflow statuses
        run: >-
          python3 meta/tests/check_workflow.py
          --major ${{ matrix.major }} --workspace "$RUNNER_TEMP/port-validation"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kicad-${{ matrix.major }}-trial
          path: ${{ runner.temp }}/port-validation/
